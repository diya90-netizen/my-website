<!DOCTYPE html>
<html>

<head>
    <title>Change Calculator</title>
</head>

<body>

    <h2>Change Calculator</h2>

    <label>Enter Amount: </label>
    <input type="number" id="amount" min="0">
    <button onclick="calculateChange()">Calculate</button>

    <h3>Result:</h3>
    <p id="result"></p>

    <script>
        function calculateChange() {
            let amount = parseInt(document.getElementById("amount").value);

            if (isNaN(amount) || amount < 0) {
                document.getElementById("result").innerHTML = "Please enter a valid amount.";
                return;
            }

            let denominations = [1000, 500, 100, 50, 20, 10, 5, 2, 1];
            let names = [
                "$1000 note",
                "$500 note",
                "$100 note",
                "$50 note",
                "$20 note",
                "$10 coin",
                "$5 coin",
                "$2 coin",
                "$1 coin"
            ];

            let output = "";

            for (let i = 0; i < denominations.length; i++) {
                let count = Math.floor(amount / denominations[i]);
                amount %= denominations[i];

                output += names[i] + ": " + count + "<br>";
            }

            document.getElementById("result").innerHTML = output;
        }
    </script>

</body>

</html>
