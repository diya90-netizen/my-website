<!DOCTYPE HTML>
<html>

<head>

    <style>
        #div1,
        #div2 {
            float: left;
            width: 100px;
            height: 100px;
            margin: 10px;
            padding: 10px;
            border: 1px solid black;
        }
        
        #page {
            clear: both;
            width: 100%;
            height: 500px;
            margin-top: 20px;
            border: 1px dashed gray;
            position: relative;
        }
    </style>

    <script>
        function dragstartHandler(ev) {
            ev.dataTransfer.setData("text", ev.target.id);
        }

        function dragoverHandler(ev) {
            ev.preventDefault();
        }

        function dropHandler(ev) {
            ev.preventDefault();

            const data = ev.dataTransfer.getData("text");
            const img = document.getElementById(data);

            document.body.appendChild(img);

            img.style.position = "absolute";
            img.style.left = ev.clientX + "px";
            img.style.top = ev.clientY + "px";
        }
    </script>

</head>

<body>

    <h1>Drag and Drop API</h1>

    <p>Drag the image out of the box.</p>

    <div id="div1" ondrop="dropHandler(event)" ondragover="dragoverHandler(event)">

        <img id="img1" src="https://www.w3schools.com/html/img_w3slogo.gif" draggable="true" ondragstart="dragstartHandler(event)" width="88" height="31">

    </div>

    <div id="div2" ondrop="dropHandler(event)" ondragover="dragoverHandler(event)">
    </div>

    <div id="page" ondrop="dropHandler(event)" ondragover="dragoverHandler(event)">
    </div>

</body>

</html>
